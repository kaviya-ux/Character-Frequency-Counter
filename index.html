<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Frequency Counter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-lg p-6">
        <!-- Heading -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">
                Character Frequency Counter
            </h1>
            <p class="text-gray-500 mt-2">
                Enter text and find how many times each character appears.
            </p>
        </div>
        <!-- Text Input -->
        <div class="mb-4">
            <label for="textInput" class="block font-semibold text-gray-700 mb-2">
                Enter your text
            </label>
            <textarea  id="textInput"  rows="5" placeholder="Type something here..."
                class="w-full border border-gray-300 rounded-lg p-4 outline-none focus:ring-2 focus:ring-blue-500 resize-none" ></textarea>
        </div>
        <!-- Options -->
        <div class="flex items-center gap-2 mb-5">
            <input type="checkbox" id="ignoreSpaces" class="w-4 h-4">
            <label for="ignoreSpaces" class="text-gray-700">
                Ignore spaces
            </label>
        </div>
        <!-- Button -->
        <button id="countButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition" >
            Count Characters
        </button>
        <!-- Result -->
        <div id="resultSection" class="mt-6 hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-3">
                Character Frequency
            </h2>
            <div id="result"  class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"  ></div>
        </div>
        <!-- Error Message -->
        <p  id="errorMessage" class="text-red-500 text-center mt-4 hidden" >
            Please enter some text.
        </p>
    </div>
    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
